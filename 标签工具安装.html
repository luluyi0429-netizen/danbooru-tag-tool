<h1>Danbooru 标签过滤工具 v2</h1>
<div class="box">
  <p>把下面的按钮拖到 Chrome 书签栏：</p>
  <p><a id="bookmark" href="#">一键标签</a></p>
  <p>打开 Danbooru 单张图片页面后，点击书签即可。默认过滤人物外貌，支持调整类别、预览保留与已过滤标签、保存个人例外、复制和下载 TXT。</p>
  <p>已有旧版书签：删除旧书签，再拖入上面的新版“一键标签”。未识别的标签会保留供你检查。</p>
  <p>也可以在 Tampermonkey 中安装同目录的 <code>danbooru-tag-tool.user.js</code>，这样每次打开帖子会自动显示。</p>
